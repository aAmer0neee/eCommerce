syntax = "proto3";

package proto.auth.v1;

option go_package = "github.com/aAmer0neee/eCommerce/gen/auth/v1;authv1";

// *** MODELS


// *** REQUESTS

message AuthenticateRequest {
    string email = 1;
    string password = 2;
}

message AuthenticateResponse {
    string id = 1;
    string access = 2;
    string refresh = 3;
}

message RefreshRequest{
    string access = 1;
    string refresh = 2;
}

message RefreshResponse{
    string access = 1;
    string refresh = 2;
}

// *** SERVICES

service AuthService {
    rpc Authenticate(AuthenticateRequest) returns (AuthenticateResponse);
    rpc Refresh(RefreshRequest)returns(RefreshResponse);
}