version: v1
plugins:
  - plugin: go
    out: ../gen/auth/v1
    opt:
      - paths=source_relative
  - plugin: go-grpc
    out: ../gen/auth/v1
    opt:
      - paths=source_relative
  - plugin: go
    out: ../gen/user/v1
    opt:
      - paths=source_relative
  - plugin: go-grpc
    out: ../gen/user/v1
    opt:
      - paths=source_relative